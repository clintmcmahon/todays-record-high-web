name: Deploy to Vultr

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Test
        run: dotnet test TodaysRecordHigh.Web/TodaysRecordHigh.Web.sln -c Release

      - name: Publish
        run: dotnet publish TodaysRecordHigh.Web/TodaysRecordHigh.Web.csproj -c Release -o ./publish

      - name: Deploy via rsync
        uses: burnett01/rsync-deployments@6.0.0
        with:
          switches: -avzr --delete
          path: ./publish/
          remote_path: /var/www/todaysrecordhigh/
          remote_host: ${{ secrets.DEPLOY_HOST }}
          remote_user: ${{ secrets.DEPLOY_USER }}
          remote_key: ${{ secrets.DEPLOY_KEY }}

      - name: Write app config and restart service
        uses: appleboy/ssh-action@v1.0.0
        env:
          MAPBOX_TOKEN: ${{ secrets.MAPBOX_TOKEN }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          envs: MAPBOX_TOKEN
          # The drop-in lives outside /var/www, so the rsync --delete above can't
          # clobber it. Env vars outrank appsettings.json in ASP.NET config.
          script: |
            set -e
            if [ -z "${MAPBOX_TOKEN}" ]; then
              echo "MAPBOX_TOKEN secret is not set - the map would deploy blank. Aborting."
              exit 1
            fi
            sudo mkdir -p /etc/systemd/system/todaysrecordhigh.service.d
            sudo tee /etc/systemd/system/todaysrecordhigh.service.d/override.conf > /dev/null <<EOF
            [Service]
            Environment="MapboxToken=${MAPBOX_TOKEN}"
            EOF
            sudo chmod 600 /etc/systemd/system/todaysrecordhigh.service.d/override.conf
            sudo systemctl daemon-reload
            sudo systemctl restart todaysrecordhigh